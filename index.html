<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>好婚市集 行前通知</title><style>

.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.pre{white-space:pre-wrap}

.tb textarea{min-height:34px;resize:vertical}.tb input[type=checkbox]{width:auto}
.tb td.ops{white-space:nowrap;width:1%}
.chip{display:inline-block;background:#eef4f9;border-radius:10px;padding:0 8px;margin:1px 3px 1px 0;font-size:12.5px;white-space:nowrap}
.chip.free{background:#f1ece7}.chip.bad{background:#fdecea;color:var(--er)}.chip x{cursor:pointer;margin-left:4px;color:var(--mu)}

.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

.muted{color:var(--mu);font-size:12px}

#pop .ls{overflow:auto;padding:4px}#pop .it{padding:4px 8px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between}
#pop .it:hover{background:#f3eee9}#pop .it.off{color:#bbb}#pop .it.sel{background:#eef4f9}

.evsel{max-width:220px;border:1px solid var(--ln);border-radius:6px;padding:4px;font:inherit;font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2522;color:#fff;padding:8px 16px;border-radius:20px;z-index:30}
[hidden]{display:none!important}

#now{background:#fff6e5;border-top:1px solid #f0dcb4;padding:6px 0;font-size:13.5px}#now b{color:var(--r)}
.rg td.cur{background:#fff6e5}.rg tr.cur td{background:#fff6e5}.me{background:var(--r);color:#fff}

@media print{header nav,.tools,.btn,.add{display:none!important}header{position:static}}

": [{"group": "指引", "leader": ["朋喬"], "area": "（開門前）門口指引", "loc": "門口外圍", "n": 1, "as": {"D1": ["杜杜"], "D2": []}, "duty": "1. {{D1}}、{{D2}} 9:30–9:50 於門口 standby 將新人整隊\n2. 想提早進場的新人做擋門，告知 {{開門}} 正式開放進場", "script": "「您好，請問是來參加婚展的嗎？」\n是 →「我們活動將準時於 {{開門}} 開門入場，可以先打開入場 QR code，在這邊排隊稍候唷！」\n否 →「歡迎掃 QR code 免費報名參加唷！」"}, {"group": "報到處組", "leader": ["朋喬"], "area": "外圍指引（出口）", "loc": "門口外圍", "n": 1, "as": {"D1": ["偉泓🕊️"], "D2": ["偉泓🕊️"]}, "duty": "1. 協助新人指引至會場\n2. 協助未報名新人完成線上報名\n3. 協助新人開啟入場 QR code（已報名者掃快速報名碼會直接顯示）\n4. 每組新人一個 QR code 即可\n5. 再次進場的新人引導至出口處", "script": "➤ 有報名：「可以先將 QR code 打開，從另一側入口處進場唷～」\n➤ 再次進場：「再次進場走這個通道唷～」\n➤ 廠商沒戴工作證：「進出要記得配戴工作人員證唷～」"}, {"group": "報到處組", "leader": ["朋喬"], "area": "紅龍指引（入口）", "loc": "門口外圍", "n": 1, "as": {"D1": ["阮靜霓"], "D2": ["阮靜霓"]}, "duty": "1. 指引新人至紅龍排隊進場\n2. 提醒新人開啟入場 QR code\n3. 廠商、工作人員、再次進場、人工報到（長輩等）走另一側出入口", "script": "➤ 已開好：「您好，這邊排隊進場參加婚展，記得將入場 QR code 打開謝謝！」\n➤ 未報名／未開好：「歡迎掃 QR code 免費報名！報名先在側邊完成再排隊謝謝！」\n➤ 廠商／再次進場／人工報到：「幫我走另一個通道這邊唷，謝謝！」"}, {"group": "報到處組", "leader": ["朋喬"], "area": "掃碼", "loc": "入口處", "n": 1, "as": {"D1": ["Queenie"], "D2": ["Una"]}, "duty": "1. 掃描新人 QR code 入場（協助蓋手章）\n2. 指引至櫃檯領取出席禮\n＊報到區人多 → 放慢掃碼；排隊人龍長 → 加速掃碼", "script": "「您好，這邊掃 QR code 入場，記得到報到區領取出席禮！」\n➤ 無法出示或掃碼不通過：「沒關係！請到前方櫃檯人工報到處幫您處理唷」"}, {"group": "報到處組", "leader": ["朋喬"], "area": "人工報到／出席禮", "loc": "人工報到", "n": 1, "as": {"D1": ["周胖"], "D2": ["周胖"]}, "duty": "1. 處理無法掃碼、無法報到者\n2. 補充提袋\n3. 新人寄放物品：留姓名電話綁在物品上", "script": "「需要人工報到嗎？請問有先線上報名嗎？」\n➤ 有：「麻煩提供手機末三碼，為您人工報到」\n➤ 沒有：「這邊幫我掃 QR code 報名唷」\n發提袋：「這是今天的出席禮提袋，前方為您做活動講解唷！」"}, {"group": "報到處組", "leader": ["朋喬"], "area": "提袋發放", "loc": "提袋發放區", "n": 1, "as": {"D1": ["梓煒"], "D2": ["梓煒"]}, "duty": "發放活動手冊＆提袋\n＊確保每位新人都經過講解後才入場", "script": "「這是今天的活動手冊＆提袋，前方為您做活動講解唷！」（手往前指引至解說人員）"}, {"group": "報到處組", "leader": ["朋喬"], "area": "引導人員", "loc": "提袋發放區", "n": 1, "as": {"D1": ["透透 Hedy"], "D2": ["透透 Hedy"]}, "duty": "告知新人有問題可找有號碼牌的服務人員\n＊確保每位新人都經過講解後才入場", "script": "「請到 XX（1~4）號，解說人員為您做活動講解唷！」\n解說人員都在忙：「請這邊稍等一下，我們安排講解人員為您解說喔！」"}, {"group": "報到處組", "leader": ["朋喬"], "area": "協助補貨", "loc": "提袋發放區", "n": 1, "as": {"D1": ["丁丁"], "D2": ["丁丁"]}, "duty": "1. 協助補充提袋\n2. 16:00 後至下訂處協助", "script": ""}, {"group": "報到處組", "leader": ["朋喬"], "area": "APP 下載推廣", "loc": "報到處", "n": 1, "as": {"D1": ["林暐智（威友）"], "D2": ["珮倫"]}, "duty": "協助新人下載 APP 玩刮刮樂", "script": "1. 協助下載好婚市集 APP（桌立牌、手冊都有 QR code）\n2. 下載完成在手冊「已兌換」欄打勾（一組限一次）\n3. 新人隨機挑一格刮刮樂，依數字給禮品\n\n＊獎品編號\n{{刮刮樂編號}}"}, {"group": "報到處組", "leader": ["朋喬", "劉芳"], "area": "活動解說（1~4 號）", "loc": "解說區", "n": 3, "as": {"D1": ["Lily", "顏嘉怡 Elaine", "瑄Nimo"], "D2": ["Lily", "顏嘉怡 Elaine", "瑄Nimo"]}, "duty": "1. 別上 1~4 號號碼牌做活動解說\n2. 隨時注意新人問題\n3. 觀察人流，引導至人少處", "script": "「您好，這是今天的活動手冊」（可順勢幫新人翻開）\nA【出席禮】好婚採購金、喜帖折價券在手冊內；下載 APP 憑手冊至報到處玩刮刮樂\nB【集點禮】靠櫃諮詢廠商蓋章，集滿兌換：\n{{集點禮}}\nC【下訂禮】下訂券 1 張：婚禮工作人員紅包袋組；2 張：抽抽樂 1 次；3 張：2 次，以此類推\nD【喜餅區】{{喜餅展示家數}} 家人氣喜餅展示盒\nE【每日早鳥】每日前 {{早鳥名額}} 名進場：30分IGI裸鑽＋皇樓禮盒"}, {"group": "主題區", "leader": [], "area": "主題區互動", "loc": "主題區", "n": 1, "as": {"D1": ["新悅"], "D2": ["新悅"]}, "duty": "1. 協助展區互動、拍照、投票\n2. 推廣喜餅大賞", "script": "「您好，這邊可以幫你們拍照喔！」\n喜餅區：禮盒旁有喜餅小卡，掃 QR code 可看鑑定團文章\n新人在找喜餅：「有在找哪一類的喜餅嗎？」→ 依回答指引禮盒位置"}, {"group": "回收組", "leader": ["周胖"], "area": "回收區", "loc": "回收區", "n": 2, "as": {"D1": ["何俐穎", "劉芯薇"], "D2": ["何俐穎", "劉芯薇"]}, "duty": "工作時間 11:00–20:00\n1. 引導廠商自行分類\n2. 紙箱多可用推車分批送至回收場", "script": ""}, {"group": "獎品兌換組", "leader": [], "area": "無框畫兌換（25點）", "loc": "禮品兌換處", "n": 2, "as": {"D1": ["Ting", "孫昕妤（威友）"], "D2": ["Ting", "黃湘庭（威友）"]}, "duty": "1. 兌換無框畫（25 點）\n2. 好友邀請兌換\n3. 協助填寫意見回饋表", "script": "「請出示活動手冊，幫您核銷喔！」（劃掉印章）\n「這是無框畫兌換小卡，請在期限內掃 QR code 填表兌換！」\n「麻煩掃 QR code 填寫意見回饋！」\n\n注意事項：\n1. 兌換期限至 {{兌換截止}}，逾期無法兌換\n2. 依填單順序製作寄送，約 30 個工作天\n3. 加大尺寸／加購可於表單內加購\n4. 照片依上傳為主，不製作似顏繪\n5. 郵局寄出，請留意到貨"}, {"group": "下訂兌換組", "leader": ["詩晴"], "area": "下訂登記", "loc": "下訂處", "n": 4, "as": {"D1": ["詩晴", "沛儀", "何苡岑（妞友）", "vicky"], "D2": ["詩晴", "沛儀", "何苡岑（妞友）", "傳安"]}, "duty": "協助新人下訂登記\n16:00 後丁丁支援（需提前請 Call 機找晉姍）", "script": "「您好，今天有下訂嗎？請出示下訂券，手機末三碼是？」\n「下訂廠商為＿＿，金額為＿＿，正確嗎？」\n  return o;
}

 if(a==='exp'){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=(S.settings.title||'行前通知')+'.json';l.click();return}
 if(a==='imp'){$('imp').click();return}
 if(a==='bulk'){const ns=$('bulk').value.split(/[\n、,，]+/).map(x=>x.trim()).filter(Boolean),have=new Set(S.people.map(p=>p.name));let c=0;ns.forEach(n=>{if(!have.has(n)){S.people.push({name:n,org:'',phone:'',days:{}});have.add(n);c++}});mark();render();toast(`新增 ${c} 人`);return}

function norm(d){const s=JSON.parse(JSON.stringify(SEED));d=d||s;['people','sched','posts','prizes','points','draws','prep','cards','fixed','rot','maps'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});d.settings={...s.settings,...(d.settings||{})};return d}

const todayK=()=>{const n=new Date(),s=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;return (days().find(d=>d.date===s)||{}).k};

let lastWarn='';

 if(!R.length){el.hidden=true;return}

 m.innerHTML=`<div class="card"><h2>自動排輪替</h2><div class="muted">勾選的崗位人員會依時段輪流換崗位；人數多於崗位時，多出來的人會排「休息／機動」</div>
