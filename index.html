<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>好婚市集 行前通知</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#f7f4f1;color:#857a72;display:flex;align-items:center;justify-content:center;height:100vh}.sp{width:28px;height:28px;border:3px solid #e4ddd6;border-top-color:#9D380E;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}@keyframes s{to{transform:rotate(360deg)}}</style>
</head><body><div><div class="sp"></div>載入中…</div>
<script>
(function(){
const API='https://script.google.com/macros/s/AKfycbwBCxV4XY2IBsQiTLCWW_7lUpkR751KILB-skkplITzmq2-0ejfCDU60EtpZlqitHZIKQ/exec';
const K='brief_app_cache';
function show(h){document.open();document.write(h);document.close()}
function cached(){try{return localStorage.getItem(K)}catch(e){return null}}
const timer=setTimeout(()=>{const c=cached();if(c){done=true;show(c)}},6000);let done=false;
fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:'getApp',args:[]})})
 .then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error);try{localStorage.setItem(K,j.data)}catch(e){}clearTimeout(timer);if(!done)show(j.data)})
 .catch(()=>{clearTimeout(timer);const c=cached();if(!done){if(c)show(c);else document.body.innerHTML='<div style="text-align:center">載入失敗，請重新整理<br><button onclick="location.reload()" style="margin-top:10px;padding:6px 14px">重新整理</button></div>'}});
})();
</script></body></html>
